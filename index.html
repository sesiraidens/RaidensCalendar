<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#ffffff">
<title>Raidens Calendar</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Manrope:wght@500;600;700&display=swap" rel="stylesheet">

<link rel="stylesheet" href="css/styles.css">

<style>
/* PRELOADER */
.preloader {
  position: fixed;
  inset: 0;
  z-index: 9999;

  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: 28px;

  background: #fff;

  opacity: 1;
  visibility: visible;

  transition:
    opacity .45s ease,
    visibility .45s ease;
}

.preloader.hide {
  opacity: 0;
  visibility: hidden;
  pointer-events: none;
}

.preloader-logo {
  width: 72px;
  height: 72px;
  object-fit: contain;

  animation: preloaderPulse 1.4s var(--spring) infinite;
}

@keyframes preloaderPulse {
  0%, 100% {
    transform: scale(1);
    filter: drop-shadow(0 0 0 transparent);
  }
  50% {
    transform: scale(1.08);
    filter: drop-shadow(0 6px 18px rgba(217,51,59,.15));
  }
}

.preloader-text {
  margin: 0;
  font-family: "Manrope", sans-serif;
  font-size: 14px;
  font-weight: 600;
  letter-spacing: .04em;
  color: #aaa;
}

.preloader-bar-track {
  width: 160px;
  height: 3px;
  background: #f0f0f0;
  border-radius: 99px;
  overflow: hidden;
}

.preloader-bar {
  width: 40%;
  height: 100%;
  background: var(--red);
  border-radius: 99px;

  animation: preloaderShimmer 1.2s ease-in-out infinite;
}

@keyframes preloaderShimmer {
  0% {
    transform: translateX(-100%);
  }
  100% {
    transform: translateX(350%);
  }
}

@media (prefers-reduced-motion: reduce) {
  .preloader-logo {
    animation: none;
  }
  .preloader-bar {
    animation: none;
    width: 100%;
  }
}
</style>
</head>

<body>

<!-- PRELOADER -->
<div class="preloader" id="preloader">
  <img
    class="preloader-logo"
    src="https://raw.githubusercontent.com/sesiraidens/portifolio/refs/heads/gh-pages/assets/logo_color-aNRVU26Y.png"
    alt="Raidens"
  >
  <p class="preloader-text">Raidens Calendar</p>
  <div class="preloader-bar-track">
    <div class="preloader-bar"></div>
  </div>
</div>

<!-- APP -->
<main class="app">

  <header>
    <div class="brand">
      <img
        class="logo"
        src="https://raw.githubusercontent.com/sesiraidens/portifolio/refs/heads/gh-pages/assets/logo_color-aNRVU26Y.png"
        alt="Raidens"
      >
      <h1>Raidens Calendar</h1>
    </div>

    <button class="btn primary header-new" id="newBtn">
      <svg viewBox="0 0 24 24" fill="none"
           stroke="currentColor" stroke-width="2"
           stroke-linecap="round">
        <path d="M12 5v14M5 12h14"/>
      </svg>
      <span class="desktop">Novo evento</span>
    </button>
  </header>

  <section class="calendar">

    <div class="toolbar">
      <div class="month-wrap">
        <h2 class="month" id="month"></h2>
      </div>

      <div class="nav">
        <button class="btn" id="today">
          <span>Hoje</span>
        </button>

        <button class="icon-btn" id="prev" aria-label="Mês anterior">
          <svg viewBox="0 0 24 24" fill="none"
               stroke="currentColor" stroke-width="2">
            <path d="m15 18-6-6 6-6"/>
          </svg>
        </button>

        <button class="icon-btn" id="next" aria-label="Próximo mês">
          <svg viewBox="0 0 24 24" fill="none"
               stroke="currentColor" stroke-width="2">
            <path d="m9 18 6-6-6-6"/>
          </svg>
        </button>
      </div>
    </div>

    <div class="weekdays">
      <div class="weekday">Dom</div>
      <div class="weekday">Seg</div>
      <div class="weekday">Ter</div>
      <div class="weekday">Qua</div>
      <div class="weekday">Qui</div>
      <div class="weekday">Sex</div>
      <div class="weekday">Sáb</div>
    </div>

    <div class="days" id="days"></div>

  </section>
</main>

<dialog id="dialog">

  <div class="dialog-head">
    <div>
      <h2 id="dialogTitle">Novo evento</h2>
      <p id="prettyDate"></p>
    </div>

    <button class="close" id="close" type="button">
      <svg viewBox="0 0 24 24" fill="none"
           stroke="currentColor" stroke-width="2">
        <path d="M6 6l12 12M18 6 6 18"/>
      </svg>
    </button>
  </div>

  <form class="form" id="form">

    <div class="field">
      <label for="title">Evento</label>
      <input
        id="title"
        type="text"
        placeholder="Nome do evento"
        autocomplete="off"
        required
      >
    </div>

    <div class="field">
      <label for="date">Data</label>
      <input id="date" type="date" required>
    </div>

    <div class="field">
      <label for="time">Horário</label>
      <input id="time" type="time">
    </div>

    <div class="actions">
      <button class="btn delete" id="deleteBtn"
              type="button" hidden>
        Excluir
      </button>

      <button class="btn" id="cancel" type="button">
        Cancelar
      </button>

      <button class="btn primary" type="submit">
        Salvar
      </button>
    </div>

  </form>
</dialog>

<div class="saved" id="saved">Salvo</div>

<!-- SCRIPTS -->
<script src="js/storage.js"></script>
<script src="js/calendar.js"></script>
<script src="js/dialog.js"></script>
<script src="js/app.js"></script>

<script>
/* PRELOADER - esconde quando tudo carregar */
window.addEventListener("load", () => {
  const preloader = document.getElementById("preloader");

  setTimeout(() => {
    preloader.classList.add("hide");

    setTimeout(() => {
      preloader.remove();
    }, 500);
  }, 800);
});
</script>

</body>
</html>
